<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('My Profile')}"></head>
<body>

  <div th:replace="~{layout/base :: navbar}"></div>
  <div th:replace="~{layout/base :: alerts}"></div>

  <main class="py-5">
    <div class="container" style="max-width: 640px;">
      <h2 class="fw-bold mb-1">My Profile</h2>
      <p class="text-muted small mb-4">View and update your personal account information</p>

      <div class="card card-custom p-4 bg-white border-0 shadow-sm">
        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
          <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
            <i class="bi bi-person-fill fs-2"></i>
          </div>
          <div>
            <h5 class="fw-bold mb-0 text-dark" th:text="${user.fullName}">Aditya Kumar</h5>
            <span class="badge bg-secondary-subtle text-secondary small" th:text="${user.role}">CUSTOMER</span>
            <span class="text-muted small ms-2">Auth via: <strong th:text="${user.authProvider}">PHONE</strong></span>
          </div>
        </div>

        <form th:action="@{/customer/profile/update}" method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Full Name</label>
            <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold small">Mobile Number</label>
            <div class="input-group">
              <span class="input-group-text bg-light">+91</span>
              <input type="tel" name="phone" th:value="${user.phone}" class="form-control" maxlength="10">
            </div>
            <div class="form-text small">Used for receiving booking updates.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold small">Email Address</label>
            <input type="email" th:value="${user.email}" class="form-control bg-light" readonly disabled>
            <div class="form-text small">Linked with Google sign-in. Cannot be altered directly.</div>
          </div>

          <div class="d-flex justify-content-end gap-2 pt-3 border-top">
            <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">
              <i class="bi bi-save me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
