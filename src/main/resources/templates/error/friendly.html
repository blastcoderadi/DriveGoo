<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${title != null ? title : 'Notice'})}"></head>
<body class="bg-light">

  <div th:replace="~{layout/base :: navbar}"></div>

  <main class="d-flex align-items-center py-5">
    <div class="container text-center" style="max-width: 580px;">
      <div class="card card-custom p-5 bg-white border-0 shadow-sm">
        <div class="rounded-circle bg-primary bg-opacity-10 text-primary d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 72px; height: 72px;">
          <i th:class="'bi fs-2 ' + ${icon != null ? icon : 'bi-exclamation-triangle-fill'}"></i>
        </div>
        <h4 class="fw-bold text-dark mb-2" th:text="${title != null ? title : 'Action Notice'}">Notice</h4>
        <p class="text-secondary mb-4" th:text="${message != null ? message : 'The requested operation could not be completed.'}">
          The requested operation could not be completed.
        </p>
        <div class="d-flex justify-content-center gap-2">
          <a th:href="@{/}" class="btn btn-navy px-4">
            <i class="bi bi-house me-1"></i> Home
          </a>
          <a th:href="@{/vehicles}" class="btn btn-outline-secondary px-4">
            <i class="bi bi-car-front me-1"></i> Explore Vehicles
          </a>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
