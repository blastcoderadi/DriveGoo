      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <g transform="translate(40, 45)">
    <!-- Tall SUV Body -->
    <path d="M 30 85 L 60 25 L 210 25 L 265 85 L 315 90 C 320 105 320 125 315 130 L 10 130 C 5 125 5 100 10 90 Z" fill="url(#suvGrad)"/>
    <path d="M 68 32 L 135 32 L 135 80 L 40 80 Z" fill="#e0f2fe" opacity="0.9"/>
    <path d="M 145 32 L 205 32 L 250 80 L 145 80 Z" fill="#e0f2fe" opacity="0.9"/>
    <!-- Big Offroad Wheels -->
    <circle cx="75" cy="130" r="32" fill="#0f172a"/>
    <circle cx="75" cy="130" r="16" fill="#94a3b8"/>
    <circle cx="250" cy="130" r="32" fill="#0f172a"/>
    <circle cx="250" cy="130" r="16" fill="#94a3b8"/>
