    <line x1="70" y1="18" x2="200" y2="18" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="200" y="215" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle">SUV</text>
</svg>

